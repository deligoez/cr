name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install the quality gate tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/tools/cmd/deadcode@latest

      # The same gate tp runs at `tp done`, verbatim: a change that fails
      # locally cannot pass here.
      - name: Quality gate
        run: go test -race ./... && golangci-lint run && ./scripts/deadcode.sh
