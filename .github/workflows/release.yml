name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The GoReleaser before-hooks run cr's own quality gate, so the release
      # runner needs the two tools the Go toolchain does not carry.
      # Pinned, measured locally, and reviewed no later than 2026-11-30. See
      # the note in ci.yml; a release must not be the run that discovers a
      # tool moved.
      - name: Install the quality gate tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install golang.org/x/tools/cmd/deadcode@v0.48.0

      # §14's release notes are the file in spec/, never the commit list
      # GoReleaser writes by default. The two releases that got the default
      # (v0.3.1 and v0.4.0) are why this is a step rather than a habit: a tag
      # is pushed once, and nobody notices the body until somebody reads the
      # release page. A missing notes file fails the release here, before any
      # archive is published.
      - name: Take the release notes and the title from spec/
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="spec/${version}-release-notes.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing; §14 publishes that file as the release body"
            exit 1
          fi
          title=$(sed -n '1s/^# cr //p' "$notes")
          if [ -z "$title" ]; then
            echo "::error::$notes must open with '# cr v<version> — <headline>'"
            exit 1
          fi
          {
            echo "RELEASE_NOTES=$notes"
            echo "RELEASE_NAME=$title"
          } >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ env.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
