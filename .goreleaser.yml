version: 2

project_name: cr

before:
  hooks:
    - go mod tidy
    - go test -race ./...
    - golangci-lint run
    - ./scripts/deadcode.sh

builds:
  - main: ./cmd/cr
    binary: cr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/deligoez/cr/internal/cli.version={{.Version}}

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

# §14.3: a release updates the Homebrew formula in deligoez/homebrew-tap, so
# that `brew install deligoez/tap/cr` installs the binary as `cr`. The block has
# the shape tp's v1.1.1 release uses. GoReleaser 2.17.1 deprecates `brews`:
# `goreleaser check` prints "DEPRECATED: brews should not be used anymore" and
# exits 2 on it, while the release workflow runs `goreleaser release`, which
# publishes the formula. The formula test's `cr version` is the prefix of what
# root.go's version template prints.
brews:
  - repository:
      owner: deligoez
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    homepage: https://github.com/deligoez/cr
    description: "Code review lifecycle manager for AI coding agents"
    license: "MIT"
    install: |
      bin.install "cr"
    test: |
      assert_match "cr version", shell_output("#{bin}/cr --version")

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore\\(deps\\)"
      - "^docs\\(changelog\\)"
