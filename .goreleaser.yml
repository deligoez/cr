version: 2

project_name: cr

before:
  hooks:
    - go mod tidy
    - go test -race ./...
    - golangci-lint run
    - ./scripts/deadcode.sh

builds:
  - main: ./cmd/cr
    binary: cr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/deligoez/cr/internal/cli.version={{.Version}}

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

# §14.3: a release publishes cr to deligoez/homebrew-tap, so that
# `brew install deligoez/tap/cr` installs the binary as `cr`. GoReleaser 2.10
# deprecated `brews` for pre-built binaries in favour of casks, and
# `goreleaser check` fails on the deprecated key.
homebrew_casks:
  - name: cr
    binaries:
      - cr
    repository:
      owner: deligoez
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    homepage: https://github.com/deligoez/cr
    description: "Code review lifecycle manager for AI coding agents"
    license: "MIT"
    # The binaries are unsigned, so macOS quarantines what brew downloads;
    # clearing the attribute is what lets `cr` run after install.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cr"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore\\(deps\\)"
      - "^docs\\(changelog\\)"
